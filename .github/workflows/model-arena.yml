name: 实时模型榜

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/model-arena.yml'
      - 'scripts/fetch-model-arena.mjs'
      - 'scripts/model-arena-core.mjs'
      - 'scripts/verify-model-arena.mjs'
      - 'tests/model-arena-core.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使榜单未变化也重新写入文件'
        required: true
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run model arena tests
        run: npm test

      - name: Generate live leaderboard data
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            npm run model-arena:update -- --force
          else
            npm run model-arena:update
          fi

      - name: Verify generated data
        run: npm run model-arena:verify

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/model-arena.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(model-arena): update live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
